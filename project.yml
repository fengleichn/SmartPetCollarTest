name: SmartPetCollar
options:
  bundleIdPrefix: com.smartpetcollar
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT
    from: "2.1.0"
  TOCropViewController:
    url: https://github.com/TimOliver/TOCropViewController.git
    from: "2.6.0"

targets:
  SmartPetCollar:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SmartPetCollar
    info:
      path: SmartPetCollar/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "This app uses Bluetooth to connect to your pet collar device for image transfer."
        NSBluetoothPeripheralUsageDescription: "This app uses Bluetooth to connect to your pet collar device for image transfer."
        NSPhotoLibraryUsageDescription: "This app accesses your photo library to select images to send to the pet collar device."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartpetcollar.app
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "M27GC763HA"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        INFOPLIST_FILE: SmartPetCollar/Info.plist
    dependencies:
      - package: CocoaMQTT
        product: CocoaMQTT
      - package: TOCropViewController
        product: TOCropViewController
