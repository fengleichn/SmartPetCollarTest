pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://repo.eclipse.org/content/repositories/paho-snapshots/" }
        maven { url "https://jitpack.io" }
        // AMap (Gaode) SDK - hosted on Aliyun public mirror (mainland-China friendly,
        // mirrors the old jcenter content where AMap publishes its AARs).
        maven { url "https://maven.aliyun.com/repository/public" }
    }
}

rootProject.name = "SmartPetCollar"
include ':app'
include ':ble'
